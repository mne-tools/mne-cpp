# ---------------------------------------------------------------------------
# Reusable workflow: Build & Test MNE-CPP
# Called by main.yml, staging.yml, and pull-request.yml
# ---------------------------------------------------------------------------
name: Reusable Tests

on:
  workflow_call:
    inputs:
      qt_version:
        description: "Qt toolchain to test against: 'max' (QT_VERSION) or 'min' (QT_MIN_VERSION)"
        required: false
        default: max
        type: string
      with_code_coverage:
        description: "Enable gcov code coverage instrumentation (Linux only)"
        required: false
        default: false
        type: boolean
      upload_codecov:
        description: "Upload coverage to Codecov (requires CODECOV_TOKEN secret)"
        required: false
        default: false
        type: boolean
      enforce_coverage_gate:
        description: "Fail below the floor or on regression, as set in scripts/quality/coverage_policy.json"
        required: false
        default: false
        type: boolean
      os_json:
        description: "JSON list of runner OSes to test on"
        required: false
        default: '["ubuntu-24.04", "macos-26", "windows-2025-vs2026"]'
        type: string
      save_ccache:
        description: "Save the ccache and prune older entries (needs actions: write)"
        required: false
        default: false
        type: boolean
    secrets:
      CODECOV_TOKEN:
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  Tests:
    runs-on: ${{ matrix.os }}
    env:
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: ${{ fromJSON(inputs.os_json) }}

    steps:
    - name: Clone repository
      uses: actions/checkout@v5
      with:
        # The clang-tidy ratchet checks the units changed since the merge base with staging.
        fetch-depth: 0

    # <print> needs libstdc++ 14; the runner defaults to GCC 13.
    - name: Use GCC 14 (Linux)
      if: runner.os == 'Linux'
      run: |
        echo "CC=gcc-14" >> "$GITHUB_ENV"
        echo "CXX=g++-14" >> "$GITHUB_ENV"

    - name: Install system dependencies (Linux)
      if: matrix.os == 'ubuntu-24.04'
      run: |
        sudo rm -f /etc/apt/sources.list.d/microsoft-*.list /etc/apt/sources.list.d/azure-*.list /etc/apt/sources.list.d/microsoft-*.sources /etc/apt/sources.list.d/azure-*.sources
        sudo apt-get update -q
        # libxkbcommon-dev: the dynamic Qt toolchain is built with -xcb, so
        # Qt6::GuiPrivate now declares a third-party dependency on XKB::XKB.
        # find_package(Qt6 COMPONENTS GuiPrivate) and linking require xkbcommon.
        # gdb: the test step prints the stacks of a test that runs away with memory
        sudo apt-get install -q libgl1-mesa-dev libxkbcommon-dev gdb

    - name: Clone mne-cpp test data
      run: git clone https://github.com/mne-tools/mne-cpp-test-data.git resources/data/mne-cpp-test-data

    - name: Clear stale pip cache
      if: runner.os == 'macOS'
      run: rm -rf ~/Library/Caches/pip

    - name: Install Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        architecture: ${{ matrix.os == 'macos-26' && 'arm64' || 'x64' }}

    - name: Load external dependency versions
      shell: bash
      run: ./scripts/ci/load_external_deps.sh "${{ inputs.qt_version }}"

    - name: Download Qt toolchain (Linux|MacOS)
      if: matrix.os == 'ubuntu-24.04' || matrix.os == 'macos-26'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ./scripts/ci/download_toolchain.sh \
          --kind qt \
          --version "$QT_BUILD_VERSION" \
          --linkage dynamic \
          --output-dir "$RUNNER_TEMP/qt"

    - name: Download Eigen package (Linux|MacOS)
      if: matrix.os == 'ubuntu-24.04' || matrix.os == 'macos-26'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ./scripts/ci/download_toolchain.sh \
          --kind eigen \
          --version "$EIGEN_VERSION" \
          --output-dir "$GITHUB_WORKSPACE/src/external/eigen"

    - name: Download ONNX Runtime (Linux|MacOS)
      if: matrix.os == 'ubuntu-24.04' || matrix.os == 'macos-26'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ./scripts/ci/download_toolchain.sh \
          --kind onnxruntime \
          --version "$ONNXRUNTIME_VERSION" \
          --output-dir "$GITHUB_WORKSPACE/src/external/onnxruntime"

    - name: Download Qt toolchain (Windows)
      if: matrix.os == 'windows-2025-vs2026'
      shell: cmd
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        call scripts\ci\download_toolchain.bat --kind qt --version "%QT_BUILD_VERSION%" --linkage dynamic --output-dir "%RUNNER_TEMP%\qt"

    - name: Download Eigen package (Windows)
      if: matrix.os == 'windows-2025-vs2026'
      shell: cmd
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        call scripts\ci\download_toolchain.bat --kind eigen --version "%EIGEN_VERSION%" --output-dir "%GITHUB_WORKSPACE%\src\external\eigen"

    - name: Download ONNX Runtime (Windows)
      if: matrix.os == 'windows-2025-vs2026'
      shell: cmd
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        call scripts\ci\download_toolchain.bat --kind onnxruntime --version "%ONNXRUNTIME_VERSION%" --output-dir "%GITHUB_WORKSPACE%\src\external\onnxruntime"

    - name: Install MNE-Python
      run: |
        pip install --upgrade pip==26.2.1
        pip install mne==1.11.0 numpy==2.2.6 scipy==1.15.3 scikit-learn==1.7.2 mne-bids==0.17.0 bids-validator-deno==3.0.2 pylsl==1.18.6 brainflow==5.23.0

    - name: Cache MNE sample data
      id: cache-mne-data
      uses: actions/cache@v5
      with:
        path: ~/mne_data/MNE-sample-data
        key: mne-sample-data-v3

    - name: Download MNE sample data
      if: steps.cache-mne-data.outputs.cache-hit != 'true'
      run: |
        python -c "import mne; mne.datasets.sample.data_path()"

    # ── Compiler cache ─────────────────────────────────────────────────────
    # One entry per OS/Qt/coverage configuration, capped by CCACHE_MAXSIZE.
    # Only callers that pass save_ccache write it, and then delete the entries
    # they supersede, so the total stays at a few hundred MB per configuration
    # instead of growing with every run and evicting the other Actions caches.
    - name: Set up ccache
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          sudo apt-get install -q ccache
        elif [ "$RUNNER_OS" = "macOS" ]; then
          brew install ccache
        else
          choco install --no-progress -y ccache ninja
        fi
        {
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
          echo "CCACHE_COMPILERCHECK=content"
          # MSVC objects are about twice the size of GCC's and Clang's
          echo "CCACHE_MAXSIZE=${{ runner.os == 'Windows' && '800M' || '400M' }}"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
          # Coverage only changes the compile on Linux, so macOS shares one key.
          echo "CCACHE_KEY_PREFIX=ccache-v1-${{ matrix.os }}-qt${{ inputs.qt_version }}-cov${{ runner.os == 'Linux' && inputs.with_code_coverage }}-"
        } >> "$GITHUB_ENV"

    - name: Restore ccache
      uses: actions/cache/restore@v5
      with:
        path: ${{ runner.temp }}/ccache
        key: ${{ env.CCACHE_KEY_PREFIX }}${{ github.run_id }}
        restore-keys: ${{ env.CCACHE_KEY_PREFIX }}

    # ── Build ──────────────────────────────────────────────────────────────
    # MNE_WARNINGS_AS_ERRORS enforces release gate G5 for the test build too, so
    # test sources cannot become the loophole through which warnings return.
    - name: Configure and compile MNE-CPP (Linux)
      if: matrix.os == 'ubuntu-24.04'
      run: |
        COV_FLAG=""
        if [ "${{ inputs.with_code_coverage }}" = "true" ]; then
          COV_FLAG="-DWITH_CODE_COV=ON"
        fi
        # Without precompiled headers here, a missing #include still fails one job.
        PCH_FLAG="-DMNE_PRECOMPILED_HEADERS=${{ inputs.qt_version == 'min' && 'OFF' || 'ON' }}"
        cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DMNE_WARNINGS_AS_ERRORS=ON ${COV_FLAG} ${PCH_FLAG}
        cmake --build build -j "$(nproc)"

    # Findings per file and check may only shrink (scripts/quality/tidy_baseline.json).
    # Units are cached by tool version, config, compile command and included file contents.
    - name: Restore clang-tidy cache
      if: matrix.os == 'ubuntu-24.04' && inputs.qt_version == 'max'
      uses: actions/cache@v5
      with:
        path: .cache/clang-tidy
        key: clang-tidy-v1-${{ github.sha }}
        restore-keys: clang-tidy-v1-

    - name: clang-tidy ratchet
      if: matrix.os == 'ubuntu-24.04' && inputs.qt_version == 'max'
      run: |
        python3 -m pip install --quiet clang-tidy==22.1.8
        git fetch --quiet origin staging || true
        python3 scripts/quality/check_tidy.py -p build --jobs "$(nproc)"

    - name: Configure and compile MNE-CPP (MacOS)
      if: matrix.os == 'macos-26'
      run: |
        cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DMNE_WARNINGS_AS_ERRORS=ON
        cmake --build build -j "$(sysctl -n hw.logicalcpu)"

    # All libraries share the namespace mne, so two of them can define the same function.
    - name: "Check that no mne:: symbol is defined by two libraries"
      if: runner.os != 'Windows'
      run: python3 scripts/quality/check_duplicate_symbols.py out/Release/lib

    - name: Configure and compile MNE-CPP (Windows)
      if: matrix.os == 'windows-2025-vs2026'
      shell: pwsh
      run: |
        $vsInstallPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $vsInstallPath) { throw 'Could not locate a Visual Studio installation with VC tools.' }
        $vcvarsPath = Join-Path $vsInstallPath 'VC\Auxiliary\Build\vcvars64.bat'
        # Kept for the test steps: with Ninja, the self-test of MneTesting configures projects that need cl, rc and link
        cmd.exe /c "call `"$vcvarsPath`" && set > %RUNNER_TEMP%\vcvars.txt"
        Get-Content "$env:RUNNER_TEMP\vcvars.txt" | Foreach-Object { if ($_ -match "^(.*?)=(.*)$") { Set-Content "env:\$($matches[1])" $matches[2] } }
        # Ninja compiles the files of a target in parallel, msbuild only the targets. ccache cannot cache an MSVC
        # compile that uses a precompiled header or writes a .pdb, so neither is used here.
        cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DMNE_WARNINGS_AS_ERRORS=ON `
              -DMNE_PRECOMPILED_HEADERS=OFF -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cmake --build build --config Release --parallel
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        ccache --show-stats

    - name: Save ccache
      if: inputs.save_ccache
      uses: actions/cache/save@v5
      with:
        path: ${{ runner.temp }}/ccache
        key: ${{ env.CCACHE_KEY_PREFIX }}${{ github.run_id }}

    - name: Prune superseded ccache entries
      if: inputs.save_ccache
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        ccache --show-stats || true
        current="${CCACHE_KEY_PREFIX}${{ github.run_id }}"
        gh cache list --key "$CCACHE_KEY_PREFIX" --ref "$GITHUB_REF" --limit 100 --json id,key \
            --jq ".[] | select(.key != \"$current\") | .id" |
          while read -r id; do
            gh cache delete "$id" || true
          done

    # ── Run tests ──────────────────────────────────────────────────────────
    # CTest drives the run from the add_test() registrations rather than from a
    # glob over the binary output directory.  A test that is built but written
    # somewhere unexpected therefore fails loudly instead of silently dropping
    # out of CI (and out of the coverage numbers) the way a glob allows.
    #
    # There is deliberately no retry: gate G1 forbids an automatic re-run from
    # turning a failure into a pass.  A flaky test must be fixed or quarantined
    # by name.  --no-tests=error makes an empty suite a failure rather than a
    # silent success.  Passed-test output is kept (CTest trims it to 1 KB by
    # default) so QSKIP reasons reach the JUnit file and the run summary.
    # Install the SDK and build a separate project against it with find_package. Only the SDK prefix is on
    # the prefix path, so files the SDK fails to install are not found in the source tree, and the Qt-free
    # components it uses must not need Qt.
    - name: Build and run an SDK consumer (Linux|MacOS)
      if: runner.os != 'Windows'
      run: |
        for component in runtime sdk; do
          cmake --install build --prefix "$RUNNER_TEMP/mne-cpp-sdk" --component "$component"
        done
        env -u CMAKE_PREFIX_PATH cmake -S scripts/ci/sdk_consumer -B "$RUNNER_TEMP/sdk-consumer" \
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/mne-cpp-sdk"
        cmake --build "$RUNNER_TEMP/sdk-consumer"
        ctest --test-dir "$RUNNER_TEMP/sdk-consumer" --output-on-failure --no-tests=error

    - name: Build and run an SDK consumer (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $vsInstallPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        $vcvarsPath = Join-Path $vsInstallPath 'VC\Auxiliary\Build\vcvars64.bat'
        cmd.exe /c "call `"$vcvarsPath`" && set > %temp%\vcvars.txt"
        Get-Content "$env:temp\vcvars.txt" | Foreach-Object { if ($_ -match "^(.*?)=(.*)$") { Set-Content "env:\$($matches[1])" $matches[2] } }
        $sdk = Join-Path $env:RUNNER_TEMP 'mne-cpp-sdk'
        $consumer = Join-Path $env:RUNNER_TEMP 'sdk-consumer'
        foreach ($component in 'runtime', 'sdk') {
          cmake --install build --config Release --prefix $sdk --component $component
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
        $env:CMAKE_PREFIX_PATH = $null
        cmake -S scripts/ci/sdk_consumer -B $consumer "-DCMAKE_PREFIX_PATH=$sdk"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cmake --build $consumer --config Release
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        ctest --test-dir $consumer -C Release --output-on-failure --no-tests=error
        exit $LASTEXITCODE

    - name: Cross-check CTest inventory
      shell: bash
      run: |
        ctest --test-dir build -C Release --show-only=json-v1 > ctest-inventory.json
        python scripts/quality/validate_test_inventory.py --ctest-json ctest-inventory.json

    - name: Run tests (Linux)
      if: matrix.os == 'ubuntu-24.04'
      env:
        QTEST_FUNCTION_TIMEOUT: ${{ inputs.with_code_coverage && 1800000 || 900000 }}
        QT_QPA_PLATFORM: offscreen
        MNE_DATA: ~/mne_data
        MNE_REQUIRE_PYTHON: 'true'
      run: |
        # A runner that runs out of memory is shut down without a log, so record what is using it,
        # and stop a test past 6 GB with its stacks printed so it fails instead of taking the runner down
        (while sleep 2; do
           echo "[mem] $(date +%T) $(free -m | awk '/Mem:/ {print $3 "/" $2 " MB used"}')" \
                "$(ps -eo rss,comm --sort=-rss | awk 'NR>1 && NR<=4 {printf "%s:%dMB ", $2, $1/1024}')"
           read -r rss pid comm < <(ps -eo rss=,pid=,comm= --sort=-rss | head -1)
           if [ "${rss:-0}" -gt 6000000 ] && [[ "$comm" == test_* ]]; then
             echo "[mem] $comm ($pid) uses $((rss / 1024)) MB, stacks:"
             sudo gdb -p "$pid" -batch -ex "thread apply all bt 25" 2>&1 | grep -E '^(Thread|#)' | head -200
             kill -9 "$pid"
           fi
         done) &
        ctest --test-dir build \
              --output-on-failure \
              --no-tests=error \
              --output-junit test-results.xml \
              --test-output-size-passed 262144 \
              --timeout ${{ inputs.with_code_coverage && 3600 || 1800 }}

    - name: Run tests (MacOS)
      if: matrix.os == 'macos-26'
      env:
        QTEST_FUNCTION_TIMEOUT: 900000
        QT_QPA_PLATFORM: offscreen
        MNE_DATA: ~/mne_data
        MNE_REQUIRE_PYTHON: 'true'
      run: |
        ctest --test-dir build \
              --output-on-failure \
              --no-tests=error \
              --output-junit test-results.xml \
              --test-output-size-passed 262144 \
              --timeout 1800

    # test_mne_flash_bem/test_mne_watershed_bem declare PLATFORMS Linux Darwin,
    # so CTest reports them as skipped here instead of needing an exclusion.
    - name: Run tests (Windows)
      if: matrix.os == 'windows-2025-vs2026'
      env:
        QTEST_FUNCTION_TIMEOUT: 900000
        QT_QPA_PLATFORM: offscreen
        MNE_DATA: ~/mne_data
        MNE_REQUIRE_PYTHON: 'true'
      shell: pwsh
      run: |
        Get-Content "$env:RUNNER_TEMP\vcvars.txt" | Foreach-Object { if ($_ -match "^(.*?)=(.*)$") { Set-Content "env:\$($matches[1])" $matches[2] } }
        ctest --test-dir build -C Release `
              --output-on-failure `
              --no-tests=error `
              --output-junit test-results.xml `
              --test-output-size-passed 262144 `
              --timeout 1800

    # QTest's own log does not reach CTest on Windows; rerun failures logging to a file.
    - name: Show QTest log of failed tests (Windows)
      if: failure() && matrix.os == 'windows-2025-vs2026'
      env:
        QT_QPA_PLATFORM: offscreen
        MNE_DATA: ~/mne_data
        MNE_REQUIRE_PYTHON: 'true'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Continue'
        $failed = Get-Content build/Testing/Temporary/LastTestsFailed.log -ErrorAction SilentlyContinue
        foreach ($line in $failed) {
          $name = ($line -split ':', 2)[1]
          $exe = "out/Release/bin/$name.exe"
          if (-not (Test-Path $exe)) { continue }
          Write-Output "::group::$name"
          # A QtTest writes its log to the file; an example or a crash leaves only its console output
          $console = & $exe -o "$name.log,txt" 2>&1
          Write-Output "exit code $LASTEXITCODE"
          if (Test-Path "$name.log") {
            Get-Content "$name.log" | Select-String -NotMatch '^(QINFO|QDEBUG|Coordinate transformation)'
          }
          $console | Select-Object -Last 60
          Write-Output "::endgroup::"
        }

    # Every not-run test and every QSKIP must carry a reason (gate G1).
    - name: Summarize test run
      if: always() && hashFiles('build/test-results.xml') != ''
      shell: bash
      run: |
        python scripts/quality/summarize_test_run.py build/test-results.xml \
          --platform "${{ matrix.os }} (Qt ${{ inputs.qt_version }})" \
          --require-reasons >> "$GITHUB_STEP_SUMMARY"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.os }}${{ inputs.qt_version == 'min' && '-qt-min' || '' }}
        path: build/test-results.xml
        retention-days: 30
        if-no-files-found: warn

    # ── Coverage: generate filtered report (fastcov) ─────────────────────
    - name: Install fastcov
      if: matrix.os == 'ubuntu-24.04' && inputs.with_code_coverage
      run: pip install fastcov==1.17

    # --process-gcno keeps compiled-but-never-run files in the report at 0%.
    # summarize_coverage.py then makes paths repository-relative, applies the
    # reasoned exclusions in coverage_policy.json, and fails if a tracked
    # translation unit is missing from the report or an exclusion is stale.
    - name: Generate coverage report (fastcov)
      if: matrix.os == 'ubuntu-24.04' && inputs.with_code_coverage
      run: |
        echo "gcno files: $(find build -name '*.gcno' | wc -l)"
        echo "gcda files: $(find build -name '*.gcda' | wc -l)"
        fastcov --gcov gcov-14 --process-gcno --branch-coverage -d build -o coverage.json
        fastcov -C coverage.json --lcov -o coverage_raw.info \
             --include src/libraries/ src/applications/ src/tools/ \
             --exclude /usr Qt eigen
        python scripts/quality/summarize_coverage.py coverage_raw.info \
             --repo-root . --lcov-out coverage_filtered.info \
             --commit "${{ github.sha }}" \
             --source-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
             --json coverage-summary.json --markdown coverage-summary.md
        cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"

    # ── Coverage: Codecov upload ──────────────────────────────────────────
    # File fixes would drop brace-only lines that gcov counts, so Codecov's
    # totals would no longer match the report the gate measured.
    # Forks without the secret skip the upload; Codecov refuses tokenless uploads to a protected branch.
    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-24.04' && inputs.upload_codecov && env.HAS_CODECOV_TOKEN == 'true'
      uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage_filtered.info
        disable_search: true
        disable_file_fixes: true
        fail_ci_if_error: true

    # ── Coverage: floor & regression gate (scripts/quality/coverage_policy.json) ──
    # Saved keys carry the run id, so the exact key never matches; the prefix in
    # restore-keys picks the most recent baseline for this branch.
    - name: Restore previous coverage baseline
      id: prev-coverage
      if: matrix.os == 'ubuntu-24.04' && inputs.with_code_coverage && inputs.enforce_coverage_gate
      uses: actions/cache/restore@v5
      with:
        path: .coverage-baseline
        key: coverage-baseline-v2-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: |
          coverage-baseline-v2-${{ github.ref_name }}-

    - name: Check coverage gate
      id: coverage-gate
      if: matrix.os == 'ubuntu-24.04' && inputs.with_code_coverage && inputs.enforce_coverage_gate
      run: python scripts/quality/check_coverage_gate.py coverage_filtered.info --baseline .coverage-baseline

    - name: Save coverage baseline
      if: matrix.os == 'ubuntu-24.04' && inputs.with_code_coverage && inputs.enforce_coverage_gate && steps.coverage-gate.outcome == 'success'
      uses: actions/cache/save@v5
      with:
        path: .coverage-baseline
        key: coverage-baseline-v2-${{ github.ref_name }}-${{ github.run_id }}

    - name: Upload coverage report artifact
      if: matrix.os == 'ubuntu-24.04' && inputs.with_code_coverage
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: |
          coverage_filtered.info
          coverage-summary.json
          coverage-summary.md
        retention-days: 30
