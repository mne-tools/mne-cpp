# ---------------------------------------------------------------------------
# Reusable workflow: Build & Test MNE-CPP
# Called by main.yml, staging.yml, and pull-request.yml
# ---------------------------------------------------------------------------
name: Reusable Tests

on:
  workflow_call:
    inputs:
      qt_version:
        description: "Qt toolchain to test against: 'max' (QT_VERSION) or 'min' (QT_MIN_VERSION)"
        required: false
        default: max
        type: string
      with_code_coverage:
        description: "Enable gcov code coverage instrumentation (Linux only)"
        required: false
        default: false
        type: boolean
      upload_codecov:
        description: "Upload coverage to Codecov (requires CODECOV_TOKEN secret)"
        required: false
        default: false
        type: boolean
      enforce_coverage_gate:
        description: "Fail below the floor or on regression, as set in tools/quality/coverage_policy.json"
        required: false
        default: false
        type: boolean
    secrets:
      CODECOV_TOKEN:
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  Tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025-vs2026]

    steps:
    - name: Clone repository
      uses: actions/checkout@v5

    - name: Install system dependencies (Linux)
      if: matrix.os == 'ubuntu-24.04'
      run: |
        sudo rm -f /etc/apt/sources.list.d/microsoft-*.list /etc/apt/sources.list.d/azure-*.list /etc/apt/sources.list.d/microsoft-*.sources /etc/apt/sources.list.d/azure-*.sources
        sudo apt-get update -q
        # libxkbcommon-dev: the dynamic Qt toolchain is built with -xcb, so
        # Qt6::GuiPrivate now declares a third-party dependency on XKB::XKB.
        # find_package(Qt6 COMPONENTS GuiPrivate) and linking require xkbcommon.
        sudo apt-get install -q libgl1-mesa-dev libxkbcommon-dev

    - name: Clone mne-cpp test data
      run: git clone https://github.com/mne-tools/mne-cpp-test-data.git resources/data/mne-cpp-test-data

    - name: Clear stale pip cache
      if: runner.os == 'macOS'
      run: rm -rf ~/Library/Caches/pip

    - name: Install Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        architecture: ${{ matrix.os == 'macos-26' && 'arm64' || 'x64' }}

    - name: Load external dependency versions
      shell: bash
      run: ./scripts/ci/load_external_deps.sh "${{ inputs.qt_version }}"

    - name: Download Qt toolchain (Linux|MacOS)
      if: matrix.os == 'ubuntu-24.04' || matrix.os == 'macos-26'
      env:
        GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      run: |
        ./scripts/ci/download_toolchain.sh \
          --kind qt \
          --version "$QT_BUILD_VERSION" \
          --linkage dynamic \
          --output-dir "$RUNNER_TEMP/qt"

    - name: Download Eigen package (Linux|MacOS)
      if: matrix.os == 'ubuntu-24.04' || matrix.os == 'macos-26'
      env:
        GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      run: |
        ./scripts/ci/download_toolchain.sh \
          --kind eigen \
          --version "$EIGEN_VERSION" \
          --output-dir "$GITHUB_WORKSPACE/src/external/eigen"

    - name: Download ONNX Runtime (Linux|MacOS)
      if: matrix.os == 'ubuntu-24.04' || matrix.os == 'macos-26'
      env:
        GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      run: |
        ./scripts/ci/download_toolchain.sh \
          --kind onnxruntime \
          --version "$ONNXRUNTIME_VERSION" \
          --output-dir "$GITHUB_WORKSPACE/src/external/onnxruntime"

    - name: Clone Skigen (Linux|MacOS)
      if: matrix.os == 'ubuntu-24.04' || matrix.os == 'macos-26'
      run: ./scripts/ci/clone_skigen.sh

    - name: Download Qt toolchain (Windows)
      if: matrix.os == 'windows-2025-vs2026'
      shell: cmd
      env:
        GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      run: |
        call scripts\ci\download_toolchain.bat --kind qt --version "%QT_BUILD_VERSION%" --linkage dynamic --output-dir "%RUNNER_TEMP%\qt"

    - name: Download Eigen package (Windows)
      if: matrix.os == 'windows-2025-vs2026'
      shell: cmd
      env:
        GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      run: |
        call scripts\ci\download_toolchain.bat --kind eigen --version "%EIGEN_VERSION%" --output-dir "%GITHUB_WORKSPACE%\src\external\eigen"

    - name: Download ONNX Runtime (Windows)
      if: matrix.os == 'windows-2025-vs2026'
      shell: cmd
      env:
        GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      run: |
        call scripts\ci\download_toolchain.bat --kind onnxruntime --version "%ONNXRUNTIME_VERSION%" --output-dir "%GITHUB_WORKSPACE%\src\external\onnxruntime"

    - name: Clone Skigen (Windows)
      if: matrix.os == 'windows-2025-vs2026'
      shell: cmd
      run: call scripts\ci\clone_skigen.bat

    - name: Install MNE-Python
      run: |
        pip install --upgrade pip
        pip install mne numpy scipy scikit-learn

    - name: Cache MNE sample data
      id: cache-mne-data
      uses: actions/cache@v5
      with:
        path: ~/mne_data/MNE-sample-data
        key: mne-sample-data-v3

    - name: Download MNE sample data
      if: steps.cache-mne-data.outputs.cache-hit != 'true'
      run: |
        python -c "import mne; mne.datasets.sample.data_path()"

    # ── Build ──────────────────────────────────────────────────────────────
    # MNE_WARNINGS_AS_ERRORS enforces release gate G5 for the test build too, so
    # test sources cannot become the loophole through which warnings return.
    - name: Configure and compile MNE-CPP (Linux)
      if: matrix.os == 'ubuntu-24.04'
      run: |
        COV_FLAG=""
        if [ "${{ inputs.with_code_coverage }}" = "true" ]; then
          COV_FLAG="-DWITH_CODE_COV=ON"
        fi
        cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DMNE_WARNINGS_AS_ERRORS=ON ${COV_FLAG}
        cmake --build build -j $(nproc)

    - name: Configure and compile MNE-CPP (MacOS)
      if: matrix.os == 'macos-26'
      run: |
        cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DMNE_WARNINGS_AS_ERRORS=ON
        cmake --build build -j $(sysctl -n hw.logicalcpu)

    - name: Configure and compile MNE-CPP (Windows)
      if: matrix.os == 'windows-2025-vs2026'
      run: |
        $vsInstallPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $vsInstallPath) { throw 'Could not locate a Visual Studio installation with VC tools.' }
        $vcvarsPath = Join-Path $vsInstallPath 'VC\Auxiliary\Build\vcvars64.bat'
        cmd.exe /c "call `"$vcvarsPath`" && set > %temp%\vcvars.txt"
        Get-Content "$env:temp\vcvars.txt" | Foreach-Object { if ($_ -match "^(.*?)=(.*)$") { Set-Content "env:\$($matches[1])" $matches[2] } }
        cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DMNE_WARNINGS_AS_ERRORS=ON
        cmake --build build --config Release --parallel

    # ── Run tests ──────────────────────────────────────────────────────────
    # CTest drives the run from the add_test() registrations rather than from a
    # glob over the binary output directory.  A test that is built but written
    # somewhere unexpected therefore fails loudly instead of silently dropping
    # out of CI (and out of the coverage numbers) the way a glob allows.
    #
    # There is deliberately no retry: gate G1 forbids an automatic re-run from
    # turning a failure into a pass.  A flaky test must be fixed or quarantined
    # by name.  --no-tests=error makes an empty suite a failure rather than a
    # silent success.  Passed-test output is kept (CTest trims it to 1 KB by
    # default) so QSKIP reasons reach the JUnit file and the run summary.
    - name: Cross-check CTest inventory
      shell: bash
      run: |
        ctest --test-dir build -C Release --show-only=json-v1 > ctest-inventory.json
        python tools/quality/validate_test_inventory.py --ctest-json ctest-inventory.json

    - name: Run tests (Linux)
      if: matrix.os == 'ubuntu-24.04'
      env:
        QTEST_FUNCTION_TIMEOUT: ${{ inputs.with_code_coverage && 1800000 || 900000 }}
        QT_QPA_PLATFORM: offscreen
        MNE_DATA: ~/mne_data
        MNE_REQUIRE_PYTHON: 'true'
      run: |
        ctest --test-dir build \
              --output-on-failure \
              --no-tests=error \
              --output-junit test-results.xml \
              --test-output-size-passed 262144 \
              --timeout ${{ inputs.with_code_coverage && 3600 || 1800 }}

    - name: Run tests (MacOS)
      if: matrix.os == 'macos-26'
      env:
        QTEST_FUNCTION_TIMEOUT: 900000
        QT_QPA_PLATFORM: offscreen
        MNE_DATA: ~/mne_data
        MNE_REQUIRE_PYTHON: 'true'
      run: |
        ctest --test-dir build \
              --output-on-failure \
              --no-tests=error \
              --output-junit test-results.xml \
              --test-output-size-passed 262144 \
              --timeout 1800

    # test_mne_flash_bem/test_mne_watershed_bem declare PLATFORMS Linux Darwin,
    # so CTest reports them as skipped here instead of needing an exclusion.
    - name: Run tests (Windows)
      if: matrix.os == 'windows-2025-vs2026'
      env:
        QTEST_FUNCTION_TIMEOUT: 900000
        QT_QPA_PLATFORM: offscreen
        MNE_DATA: ~/mne_data
        MNE_REQUIRE_PYTHON: 'true'
      run: |
        ctest --test-dir build -C Release `
              --output-on-failure `
              --no-tests=error `
              --output-junit test-results.xml `
              --test-output-size-passed 262144 `
              --timeout 1800

    # Every not-run test and every QSKIP must carry a reason (gate G1).
    - name: Summarize test run
      if: always() && hashFiles('build/test-results.xml') != ''
      shell: bash
      run: |
        python tools/quality/summarize_test_run.py build/test-results.xml \
          --platform "${{ matrix.os }} (Qt ${{ inputs.qt_version }})" \
          --require-reasons >> "$GITHUB_STEP_SUMMARY"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.os }}${{ inputs.qt_version == 'min' && '-qt-min' || '' }}
        path: build/test-results.xml
        retention-days: 30
        if-no-files-found: warn

    # ── Coverage: generate filtered report (fastcov) ─────────────────────
    - name: Install fastcov
      if: matrix.os == 'ubuntu-24.04' && inputs.with_code_coverage
      run: pip install fastcov

    - name: Generate coverage report (fastcov)
      id: lcov
      if: matrix.os == 'ubuntu-24.04' && inputs.with_code_coverage
      run: |
        echo "=== Coverage diagnostics ==="
        echo "gcno files: $(find build -name '*.gcno' 2>/dev/null | wc -l)"
        echo "gcda files: $(find build -name '*.gcda' 2>/dev/null | wc -l)"
        # Collect coverage data with fastcov (10-100x faster than lcov).
        # --process-gcno includes .gcno files without .gcda counterparts
        # so that untested source files appear in the report at 0% instead
        # of being silently omitted.  This tracks ALL instrumented lines
        # across libraries, applications, and tools.
        fastcov --process-gcno -d build -o coverage.json
        # Filtered report: MNE-CPP libraries, applications, and tools
        fastcov -C coverage.json --lcov -o coverage_filtered.info \
             --include src/libraries/ src/applications/ src/tools/ \
             --exclude /usr Qt eigen
        # Extract total line coverage percentage from lcov format
        TOTAL_LINES=$(grep -c "^DA:" coverage_filtered.info 2>/dev/null || echo "0")
        HIT_LINES=$(grep "^DA:" coverage_filtered.info | awk -F, '$2 > 0' | wc -l 2>/dev/null || echo "0")
        if [ "$TOTAL_LINES" -gt 0 ]; then
          COVERAGE=$(awk "BEGIN {printf \"%.2f\", $HIT_LINES * 100.0 / $TOTAL_LINES}")
        else
          COVERAGE="0"
        fi
        echo "Total line coverage: ${COVERAGE}%"
        echo "Total lines:         ${TOTAL_LINES}"
        echo "Hit lines:           ${HIT_LINES}"
        echo "coverage=${COVERAGE}" >> "$GITHUB_OUTPUT"

    # ── Coverage: Codecov upload ──────────────────────────────────────────
    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-24.04' && inputs.upload_codecov
      uses: codecov/codecov-action@v6
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage_filtered.info
        disable_search: true
        fail_ci_if_error: true

    # ── Coverage: floor & regression gate (tools/quality/coverage_policy.json) ──
    # Saved keys carry the run id, so the exact key never matches; the prefix in
    # restore-keys picks the most recent baseline for this branch.
    - name: Restore previous coverage baseline
      id: prev-coverage
      if: matrix.os == 'ubuntu-24.04' && inputs.with_code_coverage && inputs.enforce_coverage_gate
      uses: actions/cache/restore@v5
      with:
        path: .coverage-baseline
        key: coverage-baseline-v2-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: |
          coverage-baseline-v2-${{ github.ref_name }}-

    - name: Check coverage gate
      id: coverage-gate
      if: matrix.os == 'ubuntu-24.04' && inputs.with_code_coverage && inputs.enforce_coverage_gate
      run: python tools/quality/check_coverage_gate.py coverage_filtered.info --baseline .coverage-baseline

    - name: Save coverage baseline
      if: matrix.os == 'ubuntu-24.04' && inputs.with_code_coverage && inputs.enforce_coverage_gate && steps.coverage-gate.outcome == 'success'
      uses: actions/cache/save@v5
      with:
        path: .coverage-baseline
        key: coverage-baseline-v2-${{ github.ref_name }}-${{ github.run_id }}

    - name: Upload coverage report artifact
      if: matrix.os == 'ubuntu-24.04' && inputs.with_code_coverage
      uses: actions/upload-artifact@v7
      with:
        name: coverage-report
        path: |
          coverage_filtered.info
        retention-days: 30
