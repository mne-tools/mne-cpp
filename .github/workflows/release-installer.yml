name: Release Installer

# Build platform installers with the Qt Installer Framework.
# Each installer is self-contained (offline) and bundles the MNE-CPP
# dynamic & static release archives directly.

on:
  workflow_call:

concurrency:
  group: release-installer-${{ github.ref }}
  cancel-in-progress: false

env:
  QIF_VERSION: "4.11.0"

jobs:
  LinuxInstaller:
    runs-on: ubuntu-24.04

    steps:
    - name: Clone repository
      uses: actions/checkout@v5

    - name: Install Qt Installer Framework
      env:
        GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      run: |
        sudo rm -f /etc/apt/sources.list.d/microsoft-*.list /etc/apt/sources.list.d/azure-*.list /etc/apt/sources.list.d/microsoft-*.sources /etc/apt/sources.list.d/azure-*.sources
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          libxkbcommon-x11-0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-shape0 \
          libxcb-xinerama0 \
          libxcb-xkb1 \
          libxcb-cursor0
        ./scripts/ci/download_toolchain.sh \
          --kind ifw \
          --version "${{ env.QIF_VERSION }}" \
          --output-dir "$RUNNER_TEMP/ifw"

    - name: Determine release tag
      id: tag
      shell: bash
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "asset_prefix=mne-cpp-${TAG#v}" >> "$GITHUB_OUTPUT"
        elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
          echo "tag=latest" >> "$GITHUB_OUTPUT"
          echo "asset_prefix=mne-cpp-latest" >> "$GITHUB_OUTPUT"
        else
          echo "tag=dev_build" >> "$GITHUB_OUTPUT"
          echo "asset_prefix=mne-cpp-dev" >> "$GITHUB_OUTPUT"
        fi
        VERSION=$(sed -nE 's/^set\(MNE_CPP_VERSION_(MAJOR|MINOR|PATCH) ([0-9]+)\)/\2/p' src/CMakeLists.txt | paste -sd. -)
        echo "MNE_CPP_VERSION=${VERSION}" >> "$GITHUB_ENV"

    - name: Prepare installer payload
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      run: |
        python3 scripts/deploy/stage_installer.py \
          --platform linux \
          --release-tag "${{ steps.tag.outputs.tag }}" \
          --output-dir build_installer/staging

    - name: Build installer with binarycreator
      run: |
        binarycreator \
          -r build_installer/staging/config/hero.qrc \
          -c build_installer/staging/config/config.xml \
          -p build_installer/staging/packages \
          MNE-CPP-${{ env.MNE_CPP_VERSION }}-Linux.run
        ls -lh MNE-CPP-*.run

    - name: Upload installer
      env:
        GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      run: |
        cp MNE-CPP-*-Linux.run "${{ steps.tag.outputs.asset_prefix }}-linux-installer-x86_64.run"
        gh release upload "${{ steps.tag.outputs.tag }}" "${{ steps.tag.outputs.asset_prefix }}-linux-installer-x86_64.run" --clobber

  MacOSInstaller:
    runs-on: macos-26

    steps:
    - name: Clone repository
      uses: actions/checkout@v5

    - name: Install Qt Installer Framework
      env:
        GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      run: |
        ./scripts/ci/download_toolchain.sh \
          --kind ifw \
          --version "${{ env.QIF_VERSION }}" \
          --output-dir "$RUNNER_TEMP/ifw"

    - name: Determine release tag
      id: tag
      shell: bash
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "asset_prefix=mne-cpp-${TAG#v}" >> "$GITHUB_OUTPUT"
        elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
          echo "tag=latest" >> "$GITHUB_OUTPUT"
          echo "asset_prefix=mne-cpp-latest" >> "$GITHUB_OUTPUT"
        else
          echo "tag=dev_build" >> "$GITHUB_OUTPUT"
          echo "asset_prefix=mne-cpp-dev" >> "$GITHUB_OUTPUT"
        fi
        VERSION=$(sed -nE 's/^set\(MNE_CPP_VERSION_(MAJOR|MINOR|PATCH) ([0-9]+)\)/\2/p' src/CMakeLists.txt | paste -sd. -)
        echo "MNE_CPP_VERSION=${VERSION}" >> "$GITHUB_ENV"

    - name: Prepare installer payload
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      run: |
        python3 scripts/deploy/stage_installer.py \
          --platform macos \
          --release-tag "${{ steps.tag.outputs.tag }}" \
          --output-dir build_installer/staging

    # -----------------------------------------------------------------
    # Code Signing & Notarization
    # -----------------------------------------------------------------
    - name: Import Apple Developer ID certificate
      if: startsWith(github.ref, 'refs/tags/')
      uses: ./.github/actions/macos-codesign-setup
      with:
        certificate-p12-base64: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
        certificate-password: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}

    - name: Build installer with binarycreator
      run: |
        binarycreator \
          -r build_installer/staging/config/hero.qrc \
          -c build_installer/staging/config/config.xml \
          -p build_installer/staging/packages \
          MNE-CPP-${{ env.MNE_CPP_VERSION }}-Darwin

    - name: Codesign installer app
      if: env.CODESIGN_IDENTITY != ''
      run: |
        codesign --force --deep --options runtime --timestamp \
          --sign "$CODESIGN_IDENTITY" \
          "MNE-CPP-${{ env.MNE_CPP_VERSION }}-Darwin.app"
        codesign --verify --verbose "MNE-CPP-${{ env.MNE_CPP_VERSION }}-Darwin.app"

    # binarycreator appends its payload after linking, which breaks the linker's ad-hoc signature;
    # Apple silicon kills an app with an invalid signature, so unsigned builds are re-signed ad hoc
    - name: Ad-hoc sign installer app
      if: env.CODESIGN_IDENTITY == ''
      run: |
        codesign --force --deep --sign - "MNE-CPP-${{ env.MNE_CPP_VERSION }}-Darwin.app"
        codesign --verify --deep --strict "MNE-CPP-${{ env.MNE_CPP_VERSION }}-Darwin.app"
        "MNE-CPP-${{ env.MNE_CPP_VERSION }}-Darwin.app/Contents/MacOS/MNE-CPP-${{ env.MNE_CPP_VERSION }}-Darwin" --version

    - name: Free up disk space before DMG creation
      run: |
        echo "=== Disk usage before cleanup ==="
        df -h
        sudo rm -rf /usr/local/share/gtk-doc /usr/local/Cellar \
          /usr/local/lib/node_modules /usr/share/dotnet \
          /opt/hostedtoolcache /Users/runner/Library/Caches/* 2>/dev/null || true
        echo "=== Disk usage after cleanup ==="
        df -h

    - name: Create DMG
      run: |
        hdiutil create \
          -volname "MNE-CPP ${{ env.MNE_CPP_VERSION }}" \
          -srcfolder "MNE-CPP-${{ env.MNE_CPP_VERSION }}-Darwin.app" \
          -ov -format UDZO \
          "MNE-CPP-${{ env.MNE_CPP_VERSION }}-Darwin.dmg"
        ls -lh MNE-CPP-*-Darwin.dmg

    - name: Sign, notarize and staple DMG
      if: env.CODESIGN_IDENTITY != ''
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: ./scripts/deploy/macos_notarize.sh "MNE-CPP-${{ env.MNE_CPP_VERSION }}-Darwin.dmg"

    - name: Cleanup keychain
      if: always() && env.KEYCHAIN_PATH != ''
      run: |
        security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

    - name: Upload installer
      env:
        GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      run: |
        cp MNE-CPP-*-Darwin.dmg "${{ steps.tag.outputs.asset_prefix }}-macos-installer-arm64.dmg"
        gh release upload "${{ steps.tag.outputs.tag }}" "${{ steps.tag.outputs.asset_prefix }}-macos-installer-arm64.dmg" --clobber
        python3 tools/release/artifact_evidence.py inspect "${{ steps.tag.outputs.asset_prefix }}-macos-installer-arm64.dmg" --out evidence-macos-installer.json

    - name: Upload signing evidence
      uses: actions/upload-artifact@v7
      with:
        name: signing-evidence-macos-installer
        path: evidence-macos-installer.json

  WindowsInstaller:
    runs-on: windows-2025-vs2026

    steps:
    - name: Clone repository
      uses: actions/checkout@v5

    - name: Install Qt Installer Framework
      shell: cmd
      env:
        GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      run: |
        call scripts\ci\download_toolchain.bat --kind ifw --version "${{ env.QIF_VERSION }}" --output-dir "%RUNNER_TEMP%\ifw"

    - name: Determine release tag
      id: tag
      shell: bash
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "asset_prefix=mne-cpp-${TAG#v}" >> "$GITHUB_OUTPUT"
        elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
          echo "tag=latest" >> "$GITHUB_OUTPUT"
          echo "asset_prefix=mne-cpp-latest" >> "$GITHUB_OUTPUT"
        else
          echo "tag=dev_build" >> "$GITHUB_OUTPUT"
          echo "asset_prefix=mne-cpp-dev" >> "$GITHUB_OUTPUT"
        fi
        VERSION=$(sed -nE 's/^set\(MNE_CPP_VERSION_(MAJOR|MINOR|PATCH) ([0-9]+)\)/\2/p' src/CMakeLists.txt | paste -sd. -)
        echo "MNE_CPP_VERSION=${VERSION}" >> "$GITHUB_ENV"

    - name: Prepare installer payload
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      run: |
        python scripts/deploy/stage_installer.py \
          --platform windows \
          --release-tag "${{ steps.tag.outputs.tag }}" \
          --output-dir build_installer/staging

    - name: Build installer with binarycreator
      run: |
        binarycreator `
          -r build_installer/staging/config/hero.qrc `
          -c build_installer/staging/config/config.xml `
          -p build_installer/staging/packages `
          MNE-CPP-${{ env.MNE_CPP_VERSION }}-win64.exe

        Get-ChildItem MNE-CPP-*-win64.exe

    - name: Authenticode-sign the installer
      if: startsWith(github.ref, 'refs/tags/')
      uses: ./.github/actions/signpath-sign
      with:
        file: MNE-CPP-${{ env.MNE_CPP_VERSION }}-win64.exe
        artifact-configuration-slug: windows-installer
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}

    - name: Upload installer
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      run: |
        cp MNE-CPP-*-win64.exe "${{ steps.tag.outputs.asset_prefix }}-windows-installer-x86_64.exe"
        gh release upload "${{ steps.tag.outputs.tag }}" "${{ steps.tag.outputs.asset_prefix }}-windows-installer-x86_64.exe" --clobber
        python tools/release/artifact_evidence.py inspect "${{ steps.tag.outputs.asset_prefix }}-windows-installer-x86_64.exe" --out evidence-windows-installer.json

    - name: Upload signing evidence
      uses: actions/upload-artifact@v7
      with:
        name: signing-evidence-windows-installer
        path: evidence-windows-installer.json
