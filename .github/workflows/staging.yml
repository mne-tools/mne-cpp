# ═══════════════════════════════════════════════════════════════════════════
# Staging Branch Pipeline
# ═══════════════════════════════════════════════════════════════════════════
#
# Every push to `staging` runs the quality and docs gates, all tests (three
# OSes, minimum and maximum Qt) and the WebAssembly build. The release builds,
# installers and deployments (including the WebAssembly one) run nightly (only when `staging` moved since the last
# nightly), on manual dispatch, and after a push that changed the build or
# packaging since the last dev build, as a separate run that later pushes do
# not cancel. They only start once staging compiles. The mne-tools runner pool
# is shared by the whole organization, so they are skipped where a push cannot
# affect them.
# A failing nightly opens an issue, which closes when a nightly passes again.
#
# This is the DEVELOPMENT pipeline:
#   • Creates/updates a rolling "dev_build" pre-release on GitHub
#   • Builds development binaries for Linux, macOS, Windows
#   • Builds cross-platform installers (Linux .run, macOS .dmg, Windows .exe)
#   • Runs full test suite with coverage threshold & regression checks
#     (fails if coverage < minimum threshold or drops from previous run)
#   • Uploads coverage to Codecov (alongside local threshold checks)
#   • Deploys dev website     → mne-cpp.github.io/dev/
#   • Deploys dev Doxygen API → mne-cpp.github.io/doxygen-api/dev/
#   • Builds WebAssembly dev version
#
# Coverage is uploaded to Codecov AND checked locally via fastcov with:
#   1) A minimum threshold (configurable via COVERAGE_THRESHOLD env var)
#   2) Regression detection (compares to previous run's baseline)
#
# Branch model:  Feature → Staging → Main
# ═══════════════════════════════════════════════════════════════════════════
name: Staging

on:
  push:
    branches:
      - staging
  schedule:
    # 01:13 UTC: over Sep–Oct 2026 the mne-tools runner pool was quietest from
    # about 01:00 to 04:00 UTC (MNE-Python, MNE-BIDS and MNE-BIDS-Pipeline CI
    # all near idle), and staging pushes usually start around 07:00 UTC. The
    # tests take ~1.5 h, so the release-build burst lands around 02:45–04:15.
    - cron: '13 1 * * *'
  workflow_dispatch:
    inputs:
      release_only:
        description: "Skip the tests (a push already compiled this commit) and only build and publish releases"
        type: boolean
        default: false

# Cancel superseded push runs; a push never cancels a nightly or manual run.
# Nightly and manual runs share one group: each recreates dev_build, so a
# second one starting mid-run would delete the first one's installer inputs.
concurrency:
  group: staging-${{ github.event_name == 'push' && 'push' || 'release' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Minimum acceptable line coverage percentage (libraries only).
  # The pipeline will FAIL if coverage drops below this.
  COVERAGE_THRESHOLD: 50

jobs:

  # ── Decide whether this run publishes dev builds ─────────────────────────
  # Manual runs and a nightly with new commits do (a failed nightly is not
  # retried on the same commit; its issue stays open until a later nightly
  # passes). A push never does itself: if it changed the build or packaging
  # since the last dev build, it hands the release to a manual run, because
  # the next push would cancel the push run after dev_build was deleted.
  Changes:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      release: ${{ steps.check.outputs.release }}
      handoff: ${{ steps.check.outputs.handoff }}

    steps:
    - name: Decide whether to build releases
      id: check
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        handoff=false
        case "${{ github.event_name }}" in
          workflow_dispatch) release=true ;;
          push)
            release=false
            # Build and packaging files; tests and docs are not part of the release builds.
            # Any doubt (no dev build yet, too many files to list) hands off.
            handoff=true
            if base=$(gh api "repos/$GH_REPO/git/ref/tags/dev_build" --jq .object.sha 2>/dev/null) &&
               base=$(gh api "repos/$GH_REPO/git/tags/$base" --jq .object.sha 2>/dev/null || echo "$base") &&
               files=$(gh api "repos/$GH_REPO/compare/$base...${{ github.sha }}" \
                         --jq 'if (.files | length) < 300 then .files[].filename else "too-many" end'); then
              if ! printf '%s\n' "$files" | grep -vE '^(src/testframes|doc)/' |
                   grep -qE '(^|/)CMakeLists\.txt$|^cmake/|^scripts/(build|ci|deploy|wasm)/|^\.github/workflows/(staging\.yml|release-[^/]*|_reusable-release[^/]*)$|^too-many$'; then
                echo "No build or packaging change since the last dev build ($base)"
                handoff=false
              fi
            fi
            ;;
          schedule)
            last_sha=$(gh api "repos/$GH_REPO/actions/workflows/staging.yml/runs?event=schedule&branch=${{ github.ref_name }}&status=completed&per_page=1" \
              --jq '.workflow_runs[0].head_sha // ""')
            if [ "$last_sha" = "${{ github.sha }}" ]; then
              echo "No new commits since the last nightly ($last_sha)"
              release=false
            else
              release=true
            fi
            ;;
          *) release=false ;;
        esac
        echo "release=$release" >> "$GITHUB_OUTPUT"
        echo "handoff=$handoff" >> "$GITHUB_OUTPUT"

  # ── Compile gate ──────────────────────────────────────────────────────────
  # Releases start only once staging compiles on every test configuration, so a
  # broken build never replaces the last good dev_build. Failing tests do not
  # block it; they fail the run (and open the nightly failure issue).
  Compiled:
    runs-on: ubuntu-24.04
    needs: [Changes, Tests, TestsMinQt]
    if: ${{ !cancelled() && !inputs.release_only && (needs.Changes.outputs.release == 'true' || needs.Changes.outputs.handoff == 'true') }}
    permissions:
      actions: read

    steps:
    - name: Check that every test configuration compiled
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        gh api --paginate "repos/$GH_REPO/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs?per_page=100" \
          --jq '.jobs[] | select(.name | test("^Tests(MinQt)? / ")) |
                [.name, ([.steps[] | select(.name | startswith("Configure and compile MNE-CPP")) | select(.conclusion != "skipped") | .conclusion] | first // "missing")] | @tsv' \
          > compiled.tsv
        cat compiled.tsv
        test -s compiled.tsv
        if awk -F'\t' '$2 != "success" { bad = 1 } END { exit !bad }' compiled.tsv; then
          echo "::error::Not every test configuration compiled, so dev_build is left unchanged."
          exit 1
        fi

  # ── Hand a push's release to a run that later pushes do not cancel ───────
  Handoff:
    runs-on: ubuntu-24.04
    needs: [Changes, Compiled]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.Changes.outputs.handoff == 'true' && needs.Compiled.result == 'success' }}
    permissions:
      actions: write

    steps:
    - name: Start the release run
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: gh workflow run staging.yml --ref "${{ github.ref_name }}" -f release_only=true

  # ── Create / update dev_build pre-release ────────────────────────────────
  # A release-only run follows a push run that already passed the compile gate.
  CreateDevRelease:
    runs-on: ubuntu-24.04
    needs: [Changes, Compiled]
    if: ${{ !cancelled() && needs.Changes.outputs.release == 'true' && (inputs.release_only || needs.Compiled.result == 'success') }}
    permissions:
      contents: write

    steps:
    - name: Clone repository
      uses: actions/checkout@v5

    - name: Update dev_build tag and release
      timeout-minutes: 5
      env:
        GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      run: |
        set -x
        git config --global user.email christoph.dinh@mne-cpp.org
        git config --global user.name chdinh
        git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"

        # Delete existing dev_build release (if any)
        if gh release view dev_build > /dev/null 2>&1; then
          gh release delete dev_build --yes --cleanup-tag
        fi
        git push origin :refs/tags/dev_build 2>/dev/null || true

        # Create new tag + pre-release
        git tag dev_build -f -a -m "Development Builds"
        git push origin dev_build -f
        gh release create dev_build \
          --prerelease \
          --title "Development Builds" \
          --notes "Latest development builds from the staging branch. These are pre-release builds for testing." \
          --target ${{ github.sha }}

        # Ensure the release is published (not draft) — guards against
        # token-permission or API quirks that silently create drafts.
        gh release edit dev_build --draft=false --prerelease

  # ── Platform release builds (parallel) ───────────────────────────────────
  Linux:
    needs: CreateDevRelease
    if: ${{ !cancelled() && needs.CreateDevRelease.result == 'success' }}
    uses: ./.github/workflows/release-linux.yml
    secrets: inherit

  MacOS:
    needs: CreateDevRelease
    if: ${{ !cancelled() && needs.CreateDevRelease.result == 'success' }}
    uses: ./.github/workflows/release-macos.yml
    secrets: inherit

  Windows:
    needs: CreateDevRelease
    if: ${{ !cancelled() && needs.CreateDevRelease.result == 'success' }}
    uses: ./.github/workflows/release-windows.yml
    secrets: inherit

  # ── Installers (after all platform builds) ─────────────────────────────
  Installer:
    needs: [Linux, MacOS, Windows]
    if: ${{ !cancelled() && needs.Linux.result == 'success' && needs.MacOS.result == 'success' && needs.Windows.result == 'success' }}
    uses: ./.github/workflows/release-installer.yml
    secrets: inherit

  # No separate min/max Qt build-only jobs here: Tests and TestsMinQt compile
  # the same tree with the same warnings-as-errors flags, and the release
  # builds exercise deployment.

  # ── Tests with coverage threshold & regression checks ────────────────────
  # Coverage is only collected on Ubuntu; macOS/Windows always run without it.
  # Floor and regression tolerance come from tools/quality/coverage_policy.json.
  Tests:
    if: ${{ !inputs.release_only }}
    uses: ./.github/workflows/_reusable-tests.yml
    permissions:
      contents: read
      actions: write  # prune superseded ccache entries
    with:
      with_code_coverage: true
      upload_codecov: true
      enforce_coverage_gate: true
      save_ccache: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Min-Qt on all three OSes, so every push and the G1 evidence cover each
  # OS x Qt pair.
  TestsMinQt:
    if: ${{ !inputs.release_only }}
    uses: ./.github/workflows/_reusable-tests.yml
    permissions:
      contents: read
      actions: write  # prune superseded ccache entries
    with:
      qt_version: min
      save_ccache: true

  # ── Doxygen API documentation (dev) ──────────────────────────────────────
  Doxygen:
    runs-on: ubuntu-24.04
    needs: CreateDevRelease
    if: ${{ !cancelled() && needs.CreateDevRelease.result == 'success' }}

    steps:
    - name: Clone repository
      uses: actions/checkout@v5

    - name: Install Doxygen 1.16.1 and Graphviz
      run: |
        sudo rm -f /etc/apt/sources.list.d/microsoft-*.list /etc/apt/sources.list.d/azure-*.list /etc/apt/sources.list.d/microsoft-*.sources /etc/apt/sources.list.d/azure-*.sources
        sudo apt-get update -qq
        sudo apt-get install -qq qttools5-dev-tools graphviz
        wget -q https://github.com/doxygen/doxygen/releases/download/Release_1_16_1/doxygen-1.16.1.linux.bin.tar.gz
        tar xzf doxygen-1.16.1.linux.bin.tar.gz
        sudo install -m 755 doxygen-1.16.1/bin/doxygen /usr/local/bin/doxygen

    - name: Run Doxygen
      run: |
        cd doc/doxygen
        doxygen mne-cpp_doxyfile

    - name: Deploy qch to dev_build release
      env:
        GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      run: |
        cp doc/doxygen/qt-creator_doc/mne-cpp.qch mne-cpp-dev-doc-qtcreator.qch
        gh release upload dev_build mne-cpp-dev-doc-qtcreator.qch --clobber

    - name: Deploy Doxygen to GitHub Pages (dev subdirectory)
      env:
        GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      run: |
        cd doc/doxygen
        git config --global user.email christoph.dinh@mne-cpp.org
        git config --global user.name chdinh
        # Clone doxygen-api repo
        git clone -b gh-pages "https://x-access-token:${GH_TOKEN}@github.com/mne-cpp/doxygen-api" gh-pages
        cd gh-pages
        # Only update the /dev subdirectory — preserve stable root docs
        rm -rf dev
        mkdir -p dev
        cp -r ../html/* dev/
        git add .
        git commit -m 'Update dev API docs' --allow-empty
        git push origin gh-pages

  # ── Quality gates (static, no build) ────────────────────────────────────
  Quality:
    runs-on: ubuntu-24.04

    steps:
    - name: Clone repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Validate API registry
      run: python3 tools/validate_api_registry.py --repo-root "$GITHUB_WORKSPACE"

    # Gate T6.2: the tree was reformatted once with the pinned clang-format, so
    # every C/C++ file under src/ (minus src/external) must stay formatted.
    - name: Check C/C++ formatting
      run: |
        python3 -m pip install --quiet clang-format==21.1.8
        python3 tools/quality/check_format.py --all

    # Gate G1: a test that is built but not registered runs nowhere and is
    # counted nowhere. This catches that statically, before a build exists.
    - name: Validate test inventory
      run: |
        python3 -m unittest discover -s tools/quality/tests
        python3 tools/quality/validate_test_inventory.py

    # T10.8a: onboarding CI runs the commands the build guide shows, so both must change together.
    - name: Check documented onboarding commands
      run: python3 tools/onboarding/extract_setup_commands.py --check

    # Gate G6: the rendered gap analysis must reflect the parity records it is generated from.
    - name: Check gap analysis is current
      run: |
        python3 -m pip install --quiet mne==1.11.0 numpy==2.2.6 scipy==1.15.3 scikit-learn==1.7.2
        python3 tools/parity/gap_analysis.py --check

    # Gate G5: layering violations and dependency cycles are cheap to prevent
    # and expensive to unpick once they have been built on.
    - name: Audit dependency architecture
      run: python3 tools/quality/audit_dependencies.py --check

    - name: Lint GitHub workflows
      run: |
        tarball="$RUNNER_TEMP/actionlint.tar.gz"
        curl -fsSL -o "$tarball" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
        echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $tarball" | sha256sum -c -
        tar -xzf "$tarball" -C "$RUNNER_TEMP" actionlint
        "$RUNNER_TEMP/actionlint"

    - name: Validate SPDX license headers
      run: python3 -m tools.license_headers.validate

    - name: Check parity fixtures match their manifest
      run: python3 tools/parity/check_fixtures.py --check

    - name: Check committed quality reports are current
      run: python3 tools/quality/generate_quality_report.py --check

    - name: Generate quality dashboard
      run: python3 tools/quality/generate_quality_report.py --out-dir "$RUNNER_TEMP/quality"

    - name: Upload quality dashboard
      uses: actions/upload-artifact@v7
      with:
        name: quality-dashboard
        path: ${{ runner.temp }}/quality
        retention-days: 30

  # ── Documentation gate (T4.4): API docs, screenshots, site build ────────
  # Runs on every push (Linux only, ~20 min): it is the docs/API gate. Only
  # the Website deployment waits for the nightly.
  Docs:
    uses: ./.github/workflows/_reusable-docs.yml
    with:
      channel: dev
    secrets: inherit

  # ── Website deployment (dev) ──────────────────────────────────────
  Website:
    runs-on: ubuntu-24.04
    needs: [CreateDevRelease, Quality, Docs]
    if: ${{ !cancelled() && needs.CreateDevRelease.result == 'success' && needs.Quality.result == 'success' && needs.Docs.result == 'success' }}

    steps:
    - name: Clone repository
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Download website
      uses: actions/download-artifact@v8
      with:
        name: website-dev
        path: doc/website/build

    - name: Deploy to mne-cpp.github.io/dev/
      env:
        GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.email christoph.dinh@mne-cpp.org
        git config --global user.name chdinh
        git clone -b main --single-branch "https://x-access-token:${GH_TOKEN}@github.com/mne-cpp/mne-cpp.github.io.git"
        cd mne-cpp.github.io

        # Only update the /dev subdirectory — preserve online installer repos.
        if [ -d "dev/installer" ]; then
          mkdir -p /tmp/website-dev-installer-backup
          cp -r dev/installer /tmp/website-dev-installer-backup/
        fi

        # Only update the /dev subdirectory — preserve stable root docs
        rm -rf dev
        mkdir -p dev
        cp -RT ../doc/website/build dev/

        if [ -d "/tmp/website-dev-installer-backup/installer" ]; then
          mkdir -p dev
          cp -r /tmp/website-dev-installer-backup/installer dev/
        fi

        git add .
        git commit -m 'Update dev website' --allow-empty
        git push origin main

  # ── WebAssembly (dev) ────────────────────────────────────────────────────
  WasmBuild:
    uses: ./.github/workflows/_reusable-wasm.yml
    with:
      upload_artifact: true
    secrets: inherit

  # Builds on every run (WebAssembly breaks in ways no other build sees), but
  # publishes only in release runs.
  WebAssembly:
    runs-on: ubuntu-24.04
    needs: [CreateDevRelease, WasmBuild]
    if: ${{ !cancelled() && needs.CreateDevRelease.result == 'success' && needs.WasmBuild.result == 'success' }}
    env:
      # No checkout in this job, so gh cannot infer the repository.
      GH_REPO: ${{ github.repository }}

    steps:
    - name: Download WASM build
      uses: actions/download-artifact@v8
      with:
        name: wasm-build
        path: out/wasm

    - name: Upload WASM to dev_build release
      env:
        GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      run: |
        tar cfz mne-cpp-dev-wasm.tar.gz -C out/wasm .
        gh release upload dev_build mne-cpp-dev-wasm.tar.gz --clobber

    - name: Deploy dev WASM to mne-cpp/wasm repository
      env:
        GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.email christoph.dinh@mne-cpp.org
        git config --global user.name chdinh
        git clone "https://x-access-token:${GH_TOKEN}@github.com/mne-cpp/wasm.git" wasm-repo
        cd wasm-repo

        deploy_branch_dev_subdir() {
          local branch="$1"

          if git rev-parse --verify "origin/${branch}" > /dev/null 2>&1; then
            git checkout "${branch}"
          else
            git checkout --orphan "${branch}"
            git rm -rf --ignore-unmatch .
            git clean -f -d
            touch .nojekyll
          fi

          rm -rf dev
          mkdir -p dev
          cp -RT ../out/wasm/bin dev
          if [ -d "../out/wasm/examples" ]; then
            mkdir -p dev/examples
            cp -RT ../out/wasm/examples dev/examples
          fi

          git add .
          git commit -m "Update dev wasm builds" --allow-empty
          git push origin "${branch}"
        }

        deploy_branch_dev_subdir gh-pages
        deploy_branch_dev_subdir main

  # ── Checksums and signing evidence (after every asset upload) ─────────
  ReleaseEvidence:
    needs: [Installer, Doxygen, WebAssembly]
    if: ${{ !cancelled() && needs.Installer.result == 'success' && needs.Doxygen.result == 'success' && needs.WebAssembly.result == 'success' }}
    uses: ./.github/workflows/_reusable-release-evidence.yml
    with:
      tag: dev_build
    secrets: inherit

  # ── Nightly failure issue ────────────────────────────────────────────────
  # Opens (or comments on) one tracking issue when a nightly fails, and closes
  # it when a later nightly passes.
  NightlyStatus:
    runs-on: ubuntu-24.04
    needs: [Changes, Quality, Tests, TestsMinQt, Compiled, WasmBuild, CreateDevRelease, Linux, MacOS, Windows, Installer, Doxygen, Docs, Website, WebAssembly, ReleaseEvidence]
    if: always() && github.event_name == 'schedule' && needs.Changes.outputs.release == 'true'
    permissions:
      issues: write

    steps:
    - name: Open, update or close the nightly failure issue
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        title="Nightly staging build failed"
        number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
          --jq "map(select(.title == \"$title\")) | .[0].number // empty")
        if [ "$FAILED" = "true" ]; then
          body="The nightly staging pipeline failed on ${{ github.sha }}: $RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body

        This issue closes automatically when a nightly run passes again."
          fi
        elif [ -n "$number" ]; then
          gh issue close "$number" --comment "The nightly staging pipeline passed again on ${{ github.sha }}: $RUN_URL"
        fi
