name: Release macOS

on:
  workflow_call:

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  MacOSDynamic:
    runs-on: macos-26

    steps:
    - name: Clone repository
      uses: actions/checkout@v5

    - name: Determine release info
      id: release-info
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          TAG="${GITHUB_REF#refs/tags/}"
          PREFIX="mne-cpp-${TAG#v}" UPLOAD=true
        elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
          TAG=latest PREFIX=mne-cpp-latest UPLOAD=true
        elif [[ "$GITHUB_REF" == "refs/heads/staging" ]]; then
          TAG=dev_build PREFIX=mne-cpp-dev UPLOAD=true
        else
          TAG=none PREFIX=mne-cpp-local UPLOAD=false
        fi
        {
          echo "tag=${TAG}"
          echo "prefix=${PREFIX}"
          echo "should_upload=${UPLOAD}"
        } >> "$GITHUB_OUTPUT"
    - name: Clear stale pip cache
      run: rm -rf ~/Library/Caches/pip
    - name: Install Python 3.10 version
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        architecture: 'arm64'
    - name: Load external dependency versions
      id: deps
      shell: bash
      run: ./scripts/ci/load_external_deps.sh
    - name: Download Qt toolchain
      env:
        GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      run: |
        ./scripts/ci/download_toolchain.sh \
          --kind qt \
          --version "$QT_VERSION" \
          --linkage dynamic \
          --output-dir "$RUNNER_TEMP/qt"
    - name: Download Eigen package
      env:
        GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      run: |
        ./scripts/ci/download_toolchain.sh \
          --kind eigen \
          --version "$EIGEN_VERSION" \
          --output-dir "$GITHUB_WORKSPACE/src/external/eigen"
    - name: Download ONNX Runtime
      env:
        GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      run: |
        ./scripts/ci/download_toolchain.sh \
          --kind onnxruntime \
          --version "$ONNXRUNTIME_VERSION" \
          --output-dir "$GITHUB_WORKSPACE/src/external/onnxruntime"
    - name: Clone Skigen
      run: ./scripts/ci/clone_skigen.sh --release
    - name: Configure and compile MNE-CPP
      run: |
        ./scripts/build/build_project.sh -- -DUSE_ONNXRUNTIME=ON
    - name: Free up disk space before packaging
      run: |
        echo "Disk usage before cleanup:" && df -h
        # Remove large unused toolchains BUT preserve Qt (/opt/hostedtoolcache/Qt)
        sudo rm -rf /usr/local/share/gtk-doc /usr/local/Cellar /usr/local/lib/node_modules /usr/share/dotnet || true
        sudo rm -rf /Users/runner/Library/Caches/* 2>/dev/null || true
        # Selectively clean hostedtoolcache without deleting Qt
        find /opt/hostedtoolcache -mindepth 1 -maxdepth 1 ! -name 'Qt' -exec sudo rm -rf {} + 2>/dev/null || true
        echo "Disk usage after cleanup:" && df -h
    - name: Install create-dmg
      run: |
        brew list create-dmg >/dev/null 2>&1 || brew install create-dmg
    - name: Import Apple Developer ID certificate
      if: startsWith(github.ref, 'refs/tags/') && vars.MACOS_SIGNING != 'unavailable'
      uses: ./.github/actions/macos-codesign-setup
      with:
        certificate-p12-base64: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
        certificate-password: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
    - name: Deploy binaries (MacOS)
      env:
        # With CODESIGN_IDENTITY set (tagged releases), deploy.sh signs the apps and notarizes the .dmg.
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        echo "Qt environment:"
        echo "  QT_ROOT_DIR=${QT_ROOT_DIR:-<not set>}"
        echo "  Qt6_DIR=${Qt6_DIR:-<not set>}"
        which macdeployqt || echo "WARNING: macdeployqt not on PATH"
        ./scripts/deploy/deploy.sh dynamic pack
        # Verify archive contains Qt frameworks
        echo ""
        echo "=== Archive verification ==="
        ARCHIVE_SIZE=$(stat -f%z mne-cpp-macos-dynamic-arm64.tar.gz 2>/dev/null || echo 0)
        echo "Archive size: $((ARCHIVE_SIZE / 1048576)) MB"
        if [ "$ARCHIVE_SIZE" -lt 50000000 ]; then
          echo "ERROR: Archive is too small ($((ARCHIVE_SIZE / 1048576)) MB). Qt frameworks likely missing."
          echo "Archive contents:"
          tar tzf mne-cpp-macos-dynamic-arm64.tar.gz | head -60
          exit 1
        fi
        QT_FW_COUNT=$(tar tzf mne-cpp-macos-dynamic-arm64.tar.gz | grep -c 'Qt.*\.framework' || true)
        echo "Qt framework entries in archive: ${QT_FW_COUNT}"
        if [ "${QT_FW_COUNT}" -lt 10 ]; then
          echo "WARNING: Very few Qt framework entries found. Deployment may be incomplete."
        fi
    - name: Upload release binaries
      if: steps.release-info.outputs.should_upload == 'true'
      env:
        GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      run: |
        cp mne-cpp-macos-dynamic-arm64.tar.gz "${{ steps.release-info.outputs.prefix }}-macos-dynamic-arm64.tar.gz"
        gh release upload "${{ steps.release-info.outputs.tag }}" "${{ steps.release-info.outputs.prefix }}-macos-dynamic-arm64.tar.gz" --clobber
        # Upload the .dmg too when it was produced (deploy.sh only generates
        # it if create-dmg is available; missing file = silent skip).
        if [ -f mne-cpp-macos-dynamic-arm64.dmg ]; then
          cp mne-cpp-macos-dynamic-arm64.dmg "${{ steps.release-info.outputs.prefix }}-macos-dynamic-arm64.dmg"
          gh release upload "${{ steps.release-info.outputs.tag }}" "${{ steps.release-info.outputs.prefix }}-macos-dynamic-arm64.dmg" --clobber
          python3 tools/release/artifact_evidence.py inspect "${{ steps.release-info.outputs.prefix }}-macos-dynamic-arm64.dmg" --out evidence-macos-dynamic.json
        else
          echo "No .dmg artefact present; uploading tarball only."
        fi

    - name: Cleanup keychain
      if: always() && env.KEYCHAIN_PATH != ''
      run: security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

    - name: Upload signing evidence
      if: steps.release-info.outputs.should_upload == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: signing-evidence-macos-dynamic
        path: evidence-macos-dynamic.json
        if-no-files-found: ignore


  MacOSStatic:
    runs-on: macos-26

    steps:
    - name: Clone repository
      uses: actions/checkout@v5

    - name: Determine release info
      id: release-info
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          TAG="${GITHUB_REF#refs/tags/}"
          PREFIX="mne-cpp-${TAG#v}" UPLOAD=true
        elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
          TAG=latest PREFIX=mne-cpp-latest UPLOAD=true
        elif [[ "$GITHUB_REF" == "refs/heads/staging" ]]; then
          TAG=dev_build PREFIX=mne-cpp-dev UPLOAD=true
        else
          TAG=none PREFIX=mne-cpp-local UPLOAD=false
        fi
        {
          echo "tag=${TAG}"
          echo "prefix=${PREFIX}"
          echo "should_upload=${UPLOAD}"
        } >> "$GITHUB_OUTPUT"
    - name: Clear stale pip cache
      run: rm -rf ~/Library/Caches/pip
    - name: Install Python 3.10 version
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        architecture: 'arm64'
    - name: Install dependencies
      run: |
        brew list ninja >/dev/null 2>&1 || brew install ninja
    - name: Load external dependency versions
      id: deps
      shell: bash
      run: ./scripts/ci/load_external_deps.sh
    - name: Download Eigen package
      env:
        GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      run: |
        ./scripts/ci/download_toolchain.sh \
          --kind eigen \
          --version "$EIGEN_VERSION" \
          --output-dir "$GITHUB_WORKSPACE/src/external/eigen"
    - name: Download ONNX Runtime
      env:
        GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      run: |
        ./scripts/ci/download_toolchain.sh \
          --kind onnxruntime \
          --version "$ONNXRUNTIME_VERSION" \
          --output-dir "$GITHUB_WORKSPACE/src/external/onnxruntime"
    - name: Clone Skigen
      run: ./scripts/ci/clone_skigen.sh --release
    - name: Cache static Qt binaries
      id: cache-qt-static
      uses: actions/cache@v5
      with:
        path: Qt6_static
        key: qt-${{ steps.deps.outputs.QT_VERSION }}-static-macos-arm64-v3
    - name: Download pre-built static Qt
      id: download-qt-static
      if: steps.cache-qt-static.outputs.cache-hit != 'true'
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release download qt_binaries -p "qt6_${QT_VERSION_TOKEN}_static_binaries_macos.tar.gz" -D /tmp
        mkdir -p Qt6_static
        tar xfz "/tmp/qt6_${QT_VERSION_TOKEN}_static_binaries_macos.tar.gz" -C Qt6_static
    - name: Build static Qt from source
      if: steps.cache-qt-static.outputs.cache-hit != 'true' && steps.download-qt-static.outcome != 'success'
      run: |
        cd ..
        git clone https://code.qt.io/qt/qt5.git -b "v${QT_VERSION}"
        cd qt5
        ./init-repository -f --module-subset=qtbase,qtmultimedia,qtsvg,qtshadertools,qtserialport
        cd ..
        mkdir qt6_shadow
        cd qt6_shadow
        ../qt5/configure -static -release -prefix "$GITHUB_WORKSPACE/Qt6_static" -skip webengine -nomake tests -nomake examples -no-dbus -no-ssl -no-pch -opensource -confirm-license -- -DCMAKE_BUILD_TYPE=Release
        cmake --build . --parallel "$(sysctl -n hw.ncpu)"
        cmake --install .
    - name: Configure and compile MNE-CPP (static)
      run: |
        export CMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/Qt6_static
        ./scripts/build/build_project.sh static -- -DUSE_ONNXRUNTIME=ON
    - name: Deploy binaries (MacOS)
      run: |
        ./scripts/deploy/deploy.sh static pack
    - name: Upload release binaries
      if: steps.release-info.outputs.should_upload == 'true'
      env:
        GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      run: |
        cp mne-cpp-macos-static-arm64.tar.gz "${{ steps.release-info.outputs.prefix }}-macos-static-arm64.tar.gz"
        gh release upload "${{ steps.release-info.outputs.tag }}" "${{ steps.release-info.outputs.prefix }}-macos-static-arm64.tar.gz" --clobber
