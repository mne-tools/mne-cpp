# ---------------------------------------------------------------------------
# Reusable workflow: the libraries without Qt
# Called by pull-request.yml, staging.yml and main.yml.
# No Qt is downloaded: scripts/ci/qt_free_sdk.sh configures MNE-CPP with
# find_package(Qt6) disabled (MNE_BUILD_QT switches itself off), builds and
# tests the Qt-free libraries, examples and tests, installs the SDK, checks
# that nothing installed refers to Qt and builds scripts/ci/sdk_consumer
# against the install tree alone. On Windows there is no system zlib, so the
# pinned zlib release is built as well.
# ---------------------------------------------------------------------------
name: Reusable Qt-free SDK

on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  QtFreeSDK:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-24.04", "macos-26", "windows-2025-vs2026"]

    steps:
    - name: Clone repository
      uses: actions/checkout@v5

    # <print> needs libstdc++ 14; the runner defaults to GCC 13.
    - name: Use GCC 14 (Linux)
      if: runner.os == 'Linux'
      run: |
        echo "CC=gcc-14" >> "$GITHUB_ENV"
        echo "CXX=g++-14" >> "$GITHUB_ENV"

    - name: Load external dependency versions
      shell: bash
      run: ./scripts/ci/load_external_deps.sh max

    - name: Download Eigen package (Linux|MacOS)
      if: runner.os != 'Windows'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        ./scripts/ci/download_toolchain.sh \
          --kind eigen \
          --version "$EIGEN_VERSION" \
          --output-dir "$GITHUB_WORKSPACE/src/3rdparty/eigen"

    - name: Download Eigen package (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        call scripts\ci\download_toolchain.bat --kind eigen --version "%EIGEN_VERSION%" --output-dir "%GITHUB_WORKSPACE%\src\3rdparty\eigen"

    # ex_scene_sdl runs the trace view in an SDL3 window instead of Qt (a second host of mne_viz)
    - name: Install SDL3 (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install sdl3
        echo "SDL_ARGS=-DBUILD_VIZ_SDL=ON -DSDL3_DIR=$(brew --prefix sdl3)/lib/cmake/SDL3" >> "$GITHUB_ENV"

    - name: Build, test, install and consume the Qt-free SDK
      shell: bash
      run: |
        read -ra sdl <<< "${SDL_ARGS:-}"
        ./scripts/ci/qt_free_sdk.sh "$RUNNER_TEMP/qt-free" -DMNE_WARNINGS_AS_ERRORS=ON -DUSE_ONNXRUNTIME=OFF "${sdl[@]}"
