# ═══════════════════════════════════════════════════════════════════════════
# Pull Request Pipeline
# ═══════════════════════════════════════════════════════════════════════════
#
# Triggered on pull requests targeting `staging` or `main`.
#
# This is the FEATURE BRANCH pipeline:
#   • Verifies the project builds across all platforms
#   • Tests min + max supported Qt versions
#   • Runs the full test suite (without coverage — that's done on staging)
#   • No deployments, no releases
#
# Branch model:  Feature → Staging → Main
# ═══════════════════════════════════════════════════════════════════════════
name: Pull Request

on:
  pull_request:
    branches:
      - staging
      - main

# Cancel superseded runs for the same PR
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:

  # ── Build compatibility: minimum supported Qt ────────────────────────────
  BuildMinQt:
    uses: ./.github/workflows/_reusable-build.yml
    with:
      qt_version: min

  # ── Build compatibility: maximum supported Qt ────────────────────────────
  BuildMaxQt:
    uses: ./.github/workflows/_reusable-build.yml
    with:
      qt_version: max

  # ── Tests (no coverage collection) ──────────────────────────────────────
  Tests:
    uses: ./.github/workflows/_reusable-tests.yml
    with:
      with_code_coverage: false
      upload_codecov: false

  TestsMinQt:
    uses: ./.github/workflows/_reusable-tests.yml
    with:
      qt_version: min

  # ── Doxygen build check ─────────────────────────────────────────────────
  Doxygen:
    runs-on: ubuntu-24.04

    steps:
    - name: Clone repository
      uses: actions/checkout@v5

    # Pinned like staging/main: the warning ratchet compares Doxygen's exact texts.
    - name: Install Doxygen 1.16.1 and Graphviz
      run: |
        sudo rm -f /etc/apt/sources.list.d/microsoft-*.list /etc/apt/sources.list.d/azure-*.list /etc/apt/sources.list.d/microsoft-*.sources /etc/apt/sources.list.d/azure-*.sources
        sudo apt-get update -qq
        sudo apt-get install -qq qttools5-dev-tools graphviz
        wget -q https://github.com/doxygen/doxygen/releases/download/Release_1_16_1/doxygen-1.16.1.linux.bin.tar.gz
        tar xzf doxygen-1.16.1.linux.bin.tar.gz
        sudo install -m 755 doxygen-1.16.1/bin/doxygen /usr/local/bin/doxygen

    - name: Run Doxygen (build check only — no deploy)
      run: |
        cd doc/doxygen
        doxygen mne-cpp_doxyfile

    # Gate G3: no Doxygen warning, registry matches the XML, committed pages are current.
    - name: Build API docs (strict)
      run: doc/build-api-docs.sh --check

    # The @snippet contract: headers reference named regions in src/examples.
    - name: Check Doxygen snippets
      env:
        MNE_REQUIRE_DOXYGEN: '1'
      run: python3 -m unittest tools/quality/tests/test_doxygen_snippets.py

  # ── Documentation screenshots (T5.3) ────────────────────────────────────
  DocShots:
    uses: ./.github/workflows/_reusable-doc-shots.yml
    secrets: inherit

  # ── Validate API registry & website build ───────────────────────────────
  Docs:
    runs-on: ubuntu-24.04
    needs: DocShots

    steps:
    - name: Clone repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Validate API registry
      run: python3 tools/validate_api_registry.py --repo-root "$GITHUB_WORKSPACE"

    # Gate T6.2: the tree was reformatted once with the pinned clang-format, so
    # every C/C++ file under src/ (minus src/external) must stay formatted.
    - name: Check C/C++ formatting
      run: |
        python3 -m pip install --quiet clang-format==21.1.8
        python3 tools/quality/check_format.py --all

    # Gate G1: a test that is built but not registered runs nowhere and is
    # counted nowhere. This catches that statically, before a build exists.
    - name: Validate test inventory
      run: |
        python3 -m unittest discover -s tools/quality/tests
        python3 tools/quality/validate_test_inventory.py

    # Gate G5: layering violations and dependency cycles are cheap to prevent
    # and expensive to unpick once they have been built on.
    - name: Audit dependency architecture
      run: python3 tools/quality/audit_dependencies.py --check

    - name: Validate SPDX license headers
      run: python3 -m tools.license_headers.validate

    - name: Generate quality dashboard
      run: python3 tools/quality/generate_quality_report.py --out-dir "$RUNNER_TEMP/quality"

    - name: Upload quality dashboard
      uses: actions/upload-artifact@v7
      with:
        name: quality-dashboard
        path: ${{ runner.temp }}/quality
        retention-days: 30

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: doc/website/package-lock.json

    # Gate G3: the quality page must match doc/release/v2.4.0/*.json.
    - name: Check quality page
      run: python3 tools/quality/render_quality_pages.py --check

    # Generated by the DocShots job; the site build must not start without them.
    - name: Download documentation screenshots
      uses: actions/download-artifact@v5
      with:
        name: doc-screenshots
        path: doc/website/static/img/manual/auto

    - name: Build Docusaurus site (build check only — no deploy)
      run: |
        cd doc/website
        npm ci
        npm run build

    # Broken links/anchors/images already fail the build (docusaurus.config.ts).
    - name: Check website version routing
      run: python3 tools/quality/check_website_build.py doc/website/build --channel stable
