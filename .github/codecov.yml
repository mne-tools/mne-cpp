# Codecov configuration for release gate G2 (doc/dev-notes/v2.4.0-requirements.md).
# CI uploads coverage_filtered.info from scripts/quality/summarize_coverage.py:
# repository-relative paths, reasoned exclusions already applied
# (scripts/quality/coverage_policy.json), and no uploader file fixes, so the
# totals here are the totals the CI gate measured.
codecov:
  require_ci_to_pass: yes
  branch: staging

coverage:
  precision: 2
  round: down
  range: "50..90"
  status:
    project:
      default:
        target: auto
        threshold: 0.1%
    patch:
      default:
        target: 90%
    changes: no

# Codecov scores a line with branch counters by its branches, so a partly taken
# line counts as a hit; an executed line whose branches were never taken still
# counts as a miss, which puts Codecov slightly below the gate's line figure.
parsers:
  lcov:
    partials_as_hits: true

comment:
  layout: "reach, diff, components, tree"
  behavior: default
  require_changes: no

# One component per scope (with a status) and per module (for trends).
# scripts/quality/tests/test_summarize_coverage.py keeps this list complete.
component_management:
  individual_components:
    - component_id: libs
      name: Libraries
      paths:
        - src/libs/**
      statuses:
        - type: project
          target: auto
          threshold: 0.1%
    - component_id: applications
      name: Applications
      paths:
        - src/applications/**
      statuses:
        - type: project
          target: auto
          threshold: 0.1%
    - component_id: tools
