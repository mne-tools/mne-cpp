# Codecov configuration for release gate G2 (doc/dev-notes/v2.4.0-requirements.md).
# CI uploads coverage_filtered.info from tools/quality/summarize_coverage.py:
# repository-relative paths, reasoned exclusions already applied
# (tools/quality/coverage_policy.json), and no uploader file fixes, so the
# totals here are the totals the CI gate measured.
codecov:
  require_ci_to_pass: yes
  branch: staging

coverage:
  precision: 2
  round: down
  range: "50..90"
  status:
    project:
      default:
        target: auto
        threshold: 0.1%
    patch:
      default:
        target: 90%
    changes: no

# Codecov scores a line with branch counters by its branches; counting a partly
# taken line as a hit keeps its line coverage aligned with gcov's.  Branch
# coverage itself is reported by tools/quality/summarize_coverage.py.
parsers:
  lcov:
    partials_as_hits: true

comment:
  layout: "reach, diff, components, tree"
  behavior: default
  require_changes: no

# One component per scope (with a status) and per module (for trends).
# tools/quality/tests/test_summarize_coverage.py keeps this list complete.
component_management:
  individual_components:
    - component_id: libraries
      name: Libraries
      paths:
        - src/libraries/**
      statuses:
        - type: project
          target: auto
          threshold: 0.1%
    - component_id: applications
      name: Applications
      paths:
        - src/applications/**
      statuses:
        - type: project
          target: auto
          threshold: 0.1%
    - component_id: tools
